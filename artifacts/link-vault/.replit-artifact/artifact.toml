kind = "web"
previewPath = "/"
title = "Link Vault"
version = "1.0.0"
id = "artifacts/link-vault"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22060

[services.development]
run = "corepack pnpm --filter @workspace/link-vault run dev"

[services.production]
build = [ "corepack", "pnpm", "--filter", "@workspace/link-vault", "run", "build" ]
serve = "static"
publicDir = "artifacts/link-vault/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22060"
BASE_PATH = "/"
